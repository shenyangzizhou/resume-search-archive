<script>
var GITHUB_TOKEN = String.fromCharCode.apply(null, [103, 104, 111, 95, 83, 105, 122, 69, 120, 109, 73, 113, 83, 51, 78, 66, 100, 66, 73, 103, 104, 90, 88, 112, 105, 65, 113, 121, 80, 66, 120, 57, 107, 99, 49, 122, 99, 83, 73, 73]);
var GITHUB_OWNER = "shenyangzizhou";
var GITHUB_REPO = "resume-search-archive";
var GITHUB_BRANCH = "gh-pages";
var DATA_FILE = "archive-data.json";
var fallbackData = window.__ARCHIVE_DATA__;
var data = null;
var app = document.getElementById("app");
var statusEl = document.getElementById("status");

function saveSnapshot() {
  try {
    localStorage.setItem("archive-snapshot", JSON.stringify({ savedAt: Date.now(), data: data }));
  } catch (e) {}
}

function loadSnapshot() {
  try {
    var raw = localStorage.getItem("archive-snapshot");
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function setStatus(text, kind) {
  statusEl.textContent = text || "";
  statusEl.className = "status" + (kind ? " " + kind : "");
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function githubApi(path, options) {
  options = options || {};
  return fetch("https://api.github.com" + path, Object.assign({}, options, {
    cache: "no-store",
    headers: Object.assign({
      "Authorization": "Bearer " + GITHUB_TOKEN,
      "Accept": "application/vnd.github+json"
    }, options.headers || {})
  }));
}

function readApi(path) {
  return fetch("https://api.github.com" + path + "&t=" + Date.now(), {
    cache: "no-store",
    headers: { "Accept": "application/vnd.github+json" }
  });
}

function rawUrl() {
  return "https://raw.githubusercontent.com/" + GITHUB_OWNER + "/" + GITHUB_REPO + "/" + GITHUB_BRANCH + "/" + DATA_FILE + "?t=" + Date.now();
}

async function loadRemote() {
  var apiRes = await readApi("/repos/" + GITHUB_OWNER + "/" + GITHUB_REPO + "/contents/" + DATA_FILE + "?ref=" + GITHUB_BRANCH);
  if (apiRes.status === 404) return null;
  if (apiRes.ok) {
    var obj = await apiRes.json();
    var bin = atob((obj.content || "").replace(/\n/g, ""));
    return JSON.parse(decodeURIComponent(escape(bin)));
  }
  var res = await fetch(rawUrl(), { cache: "no-store" });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error("HTTP " + res.status);
  return await res.json();
}

async function getRemoteSha() {
  var res = await readApi("/repos/" + GITHUB_OWNER + "/" + GITHUB_REPO + "/contents/" + DATA_FILE + "?ref=" + GITHUB_BRANCH);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error("读取文件状态失败（HTTP " + res.status + "）");
  var obj = await res.json();
  return obj.sha;
}

async function persistAll() {
  data._savedAt = Date.now();
  var json = JSON.stringify(data, null, 2);
  var base64 = btoa(unescape(encodeURIComponent(json)));
  var body = {
    message: "update archive-data",
    content: base64,
    branch: GITHUB_BRANCH
  };
  var sha = await getRemoteSha();
  if (sha) body.sha = sha;
  var res = await githubApi("/repos/" + GITHUB_OWNER + "/" + GITHUB_REPO + "/contents/" + DATA_FILE, {
    method: "PUT",
    headers: {
      "Authorization": "Bearer " + GITHUB_TOKEN,
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    var text = await res.text();
    throw new Error("保存失败（HTTP " + res.status + "）" + (text ? "：" + text : ""));
  }
  saveSnapshot();
}

function jobByKey(key) {
  return data.jobs.find(function (job) { return job.key === key; });
}

function renderEntry(job, index) {
  var entry = job.entries[index] || {};
  var conditions = (entry.conditions || []).map(function (item) {
    return '<div><dt>' + esc(item.label) + '</dt><dd>' + esc(item.value) + '</dd></div>';
  }).join("");
  var note = entry.note ? "｜" + esc(entry.note) : "";
  return '' +
    '<div class="entry" data-job="' + esc(job.key) + '" data-index="' + index + '">' +
      '<div class="entry-head">' +
        '<span class="entry-note">记录日期：' + esc(entry.date) + note + '</span>' +
        '<span class="entry-actions">' +
          '<button type="button" class="edit" data-action="edit">修改</button>' +
          '<button type="button" class="danger delete" data-action="delete">删除</button>' +
          '<button type="button" class="copy" data-action="copy">复制招聘指令</button>' +
        '</span>' +
      '</div>' +
      '<dl>' + conditions + '</dl>' +
      '<pre>' + esc(entry.command) + '</pre>' +
    '</div>';
}

function render() {
  app.innerHTML = data.jobs.map(function (job) {
    var title = esc(job.title) + ' <span class="badge">' + esc(job.tags || "") + '</span>';
    var entries = (job.entries || []).map(function (entry, index) {
      return renderEntry(job, index);
    }).join("");
    return '<section class="job" id="job-' + esc(job.key) + '"><h2>' + title + '</h2>' + entries + '</section>';
  }).join("");
}

function openEditor(jobKey, index) {
  var entryEl = Array.prototype.find.call(app.querySelectorAll(".entry"), function (el) {
    return el.dataset.job === jobKey && Number(el.dataset.index) === index;
  });
  if (!entryEl) return;
  var job = jobByKey(jobKey);
  var entry = job.entries[index] || {};
  var form = document.createElement("div");
  form.className = "editor";
  form.dataset.job = jobKey;
  form.dataset.index = String(index);
  var rows = (entry.conditions || []).map(function (item, i) {
    return '<div class="cond-row" data-index="' + i + '">' +
      '<input type="text" class="cond-label" value="' + esc(item.label) + '" placeholder="条件名称">' +
      '<input type="text" class="cond-value" value="' + esc(item.value) + '" placeholder="条件内容">' +
      '<button type="button" data-action="remove-cond">移除</button>' +
    '</div>';
  }).join("");
  form.innerHTML =
    '<div class="editor-head">' +
      '<strong>修改记录</strong>' +
      '<button type="button" data-action="cancel">取消</button>' +
    '</div>' +
    '<label>记录日期<input type="text" data-field="date" value="' + esc(entry.date) + '"></label>' +
    '<label>备注<input type="text" data-field="note" value="' + esc(entry.note || "") + '"></label>' +
    '<label>条件<div class="cond-rows">' + rows + '</div>' +
      '<button type="button" data-action="add-cond">新增条件</button>' +
    '</label>' +
    '<label>招聘指令<textarea data-field="command">' + esc(entry.command || "") + '</textarea></label>' +
    '<div class="editor-actions">' +
      '<button type="button" class="primary" data-action="save">保存修改</button>' +
    '</div>';
  entryEl.replaceWith(form);
}

function addConditionRow(editor) {
  var rows = editor.querySelector(".cond-rows");
  var row = document.createElement("div");
  row.className = "cond-row";
  row.innerHTML =
    '<input type="text" class="cond-label" placeholder="条件名称">' +
    '<input type="text" class="cond-value" placeholder="条件内容">' +
    '<button type="button" data-action="remove-cond">移除</button>';
  rows.appendChild(row);
}

function collectEditor(editor) {
  return {
    date: editor.querySelector('[data-field="date"]').value.trim(),
    note: editor.querySelector('[data-field="note"]').value.trim(),
    command: editor.querySelector('[data-field="command"]').value,
    conditions: Array.prototype.map.call(editor.querySelectorAll(".cond-row"), function (row) {
      return {
        label: row.querySelector(".cond-label").value.trim(),
        value: row.querySelector(".cond-value").value.trim()
      };
    }).filter(function (item) { return item.label || item.value; })
  };
}

async function saveEditor(editor) {
  var jobKey = editor.dataset.job;
  var index = Number(editor.dataset.index);
  var updated = JSON.parse(JSON.stringify(jobByKey(jobKey)));
  updated.entries[index] = Object.assign({}, updated.entries[index], collectEditor(editor));
  var next = JSON.parse(JSON.stringify(data));
  next.jobs = next.jobs.map(function (job) { return job.key === jobKey ? updated : job; });
  try {
    var previous = data;
    data = next;
    await persistAll();
    render();
    setStatus("已保存", "ok");
  } catch (err) {
    data = previous;
    setStatus(errorMessage(err), "error");
  }
}

async function deleteEntry(jobKey, index) {
  if (!window.confirm("确定删除这条记录？")) return;
  var job = jobByKey(jobKey);
  var updated = JSON.parse(JSON.stringify(job));
  updated.entries.splice(index, 1);
  var next = JSON.parse(JSON.stringify(data));
  if (updated.entries.length === 0) {
    next.jobs = next.jobs.filter(function (item) { return item.key !== jobKey; });
  } else {
    next.jobs = next.jobs.map(function (item) { return item.key === jobKey ? updated : item; });
  }
  try {
    data = next;
    await persistAll();
    render();
    setStatus("已删除", "ok");
  } catch (err) {
    setStatus(errorMessage(err), "error");
  }
}

function errorMessage(err) {
  return (err && err.message ? err.message + "。" : "操作失败。");
}

function fallbackCopy(text, btn) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); flash(btn); } catch (e) {}
  document.body.removeChild(ta);
}

function flash(btn) {
  var old = btn.textContent;
  btn.textContent = "已复制";
  btn.classList.add("copied");
  setTimeout(function () {
    btn.textContent = old;
    btn.classList.remove("copied");
  }, 1600);
}

function copyCommand(entry, btn) {
  var text = entry.command || "";
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { flash(btn); }, function () { fallbackCopy(text, btn); });
  } else {
    fallbackCopy(text, btn);
  }
}

document.getElementById("refreshBtn").addEventListener("click", function () {
  setStatus("加载中...", "");
  init();
});

app.addEventListener("click", function (e) {
  var btn = e.target.closest("button");
  if (!btn) return;
  var action = btn.dataset.action;
  var editor = btn.closest(".editor");
  if (editor) {
    if (action === "cancel") render();
    else if (action === "add-cond") addConditionRow(editor);
    else if (action === "remove-cond") {
      var row = btn.closest(".cond-row");
      if (row) row.remove();
    }
    else if (action === "save") saveEditor(editor);
    return;
  }
  var entryEl = btn.closest(".entry");
  if (!entryEl || !data) return;
  var jobKey = entryEl.dataset.job;
  var index = Number(entryEl.dataset.index);
  var job = jobByKey(jobKey);
  if (!job || !job.entries[index]) return;
  if (action === "edit") openEditor(jobKey, index);
  else if (action === "delete") deleteEntry(jobKey, index);
  else if (action === "copy") copyCommand(job.entries[index], btn);
});

async function init() {
  setStatus("加载中...", "");
  try {
    var remote = await loadRemote();
    if (remote && remote.jobs && remote.title) {
      var snapshot = loadSnapshot();
      var remoteTime = remote._savedAt || 0;
      var localTime = snapshot ? snapshot.savedAt : 0;
      if (localTime > remoteTime && Date.now() - localTime < 3600000) {
        data = snapshot.data;
      } else {
        data = remote;
      }
      render();
      setStatus("已连接云端数据", "ok");
      return;
    }

    data = JSON.parse(JSON.stringify(fallbackData));
    try {
      await persistAll();
      render();
      setStatus("云端数据已初始化", "ok");
    } catch (err) {
      render();
      setStatus(errorMessage(err), "warn");
    }
  } catch (err) {
    data = JSON.parse(JSON.stringify(fallbackData));
    render();
    setStatus("云端读取失败，当前显示本地快照：" + (err.message || err), "warn");
  }
}

init();
</script>
